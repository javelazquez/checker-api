services:
  localstack:
    image: localstack/localstack:latest
    container_name: checker-api-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
    environment:
      - SERVICES=sqs,dynamodb
      - DEBUG=0
      - DATA_DIR=/tmp/localstack/data
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PERSISTENCE=1
      - LAMBDA_EXECUTOR=local
    volumes:
      - "./scripts/localstack-init:/etc/localstack/init/ready.d/localstack-init:ro"
      - "localstack-data:/var/lib/localstack"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - checker-network

  checker-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checker-api
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - SERVER_PORT=8080
      
      # AWS Configuration for LocalStack
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      
      # DynamoDB/KVS Configuration
      - KVS_REGION=us-east-1
      - KVS_TABLE_NAME=comparisons
      - KVS_KEY_ATTRIBUTE_NAME=id
      
      # SQS Configuration
      - SQS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/comparison-queue
      - SQS_MAX_NUMBER_OF_MESSAGES=10
      - SQS_WAIT_TIME_SECONDS=20
      - SQS_VISIBILITY_TIMEOUT=30
      
      # Environment
      - ENV=local
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - checker-network

volumes:
  localstack-data:
    driver: local

networks:
  checker-network:
    driver: bridge
